# MarketPilot v0.4 settings — PAPER TRADING ONLY.
# Live-money execution is deliberately not implemented.

account:
  currency: GBP
  starting_balance: 500.0
  risk_per_trade_pct: 0.5        # 0.5% of equity = £2.50 on £500
  daily_loss_limit_pct: 2.0      # pause new trades for the day after -2%
  max_open_positions: 8          # v0.6: more markets -> room for 8 positions (8 x 0.5% = 4% total risk)
  max_leverage: 1.0              # 1.0 = no leverage (total notional <= equity)
  max_cost_fraction_of_risk: 0.35  # reject trades where costs eat >35% of 1R

# Universe (v0.6): six market groups ("market bots"), each researched and approved
# separately. Symbols use Yahoo Finance tickers (free, unofficial data).
# Broad, long-lived ETFs rather than hand-picked companies (avoids hindsight bias).
universe:
  stocks:            # US equity: index, size and sector ETFs
    interval: 1d
    lookback_days: 7300
    symbols: [SPY, QQQ, IWM, DIA, MDY, XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLU, XLB, XLC, XLRE, VNQ]
  international:     # developed & emerging country ETFs, incl. UK FTSE 100 (priced in pence)
    interval: 1d
    lookback_days: 7300
    symbols: [EFA, EEM, EWJ, EWG, EWU, EWC, EWA, EWZ, EWY, FXI, INDA, ISF.L]
  bonds:             # government, inflation-linked, corporate & emerging-market debt
    interval: 1d
    lookback_days: 7300
    symbols: [TLT, IEF, SHY, TIP, LQD, HYG, EMB, AGG]
  commodities:       # precious & industrial metals, energy, agriculture, broad basket
    interval: 1d
    lookback_days: 7300
    symbols: [GLD, SLV, CPER, USO, UNG, DBA, DBC]
  crypto:            # large-cap coins only (momentum evidence is concentrated there)
    interval: 1d
    lookback_days: 3650
    symbols: [BTC-USD, ETH-USD, SOL-USD, XRP-USD, BNB-USD, ADA-USD, DOGE-USD, LTC-USD, LINK-USD, AVAX-USD]
  forex:             # majors and yen/franc crosses
    interval: 1d
    lookback_days: 7300
    symbols: [EURUSD=X, GBPUSD=X, USDJPY=X, EURGBP=X, AUDUSD=X, USDCAD=X, NZDUSD=X, USDCHF=X,
              EURJPY=X, GBPJPY=X, AUDJPY=X, EURCHF=X]

# Market trend filter (Faber 2007): no new LONG trades in a group while its
# benchmark closes below its 200-day average. Bonds and commodities have no
# filter because they often rise when stocks fall.
# Short side (v0.13). For these groups the "_short" versions of the strategies are
# researched and, if they pass the same approval gate, may open short paper trades.
# Shorts are only allowed while the group's benchmark (market_filter) is BELOW its
# 200-day average. Crypto is left out: crypto derivatives can't be sold to UK
# retail clients, so a crypto short could not be placed for real.
# A short pays short_carry_bps_day (in `costs`) for every day it is held.
shorting:
  enabled: true
  classes: [stocks, international, bonds, commodities]

# Intraday watch (v0.13): every hourly run checks open paper trades against
# today's 15-minute prices, so stop and target hits are booked within the hour
# instead of the next day. Pending orders fill at the session's real open.
intraday_watch:
  enabled: true
  interval: 15m

market_filter:
  stocks: {symbol: SPY}
  international: {symbol: EFA}
  crypto: {symbol: BTC-USD}

# Transaction cost model per asset class (applied in backtests AND paper fills).
# bps = basis points (1 bp = 0.01%). Commission is per side.
costs:
  stocks: {spread_bps: 2.0, slippage_bps: 3.0, commission_pct: 0.0, commission_fixed: 0.0, short_carry_bps_day: 1.5}
  international: {spread_bps: 4.0, slippage_bps: 4.0, commission_pct: 0.0, commission_fixed: 0.0, short_carry_bps_day: 1.5}
  bonds:  {spread_bps: 2.0, slippage_bps: 2.0, commission_pct: 0.0, commission_fixed: 0.0, short_carry_bps_day: 1.5}
  commodities: {spread_bps: 4.0, slippage_bps: 4.0, commission_pct: 0.0, commission_fixed: 0.0, short_carry_bps_day: 1.5}
  # crypto: entry-tier taker fee on Kraken Pro is 0.40%, Coinbase Advanced 0.60%
  crypto: {spread_bps: 10.0, slippage_bps: 10.0, commission_pct: 0.40, commission_fixed: 0.0}
  forex:  {spread_bps: 2.0, slippage_bps: 1.0, commission_pct: 0.0, commission_fixed: 0.0}   # crosses are wider than majors

# Strategy approval gate (Backtesting Bot). A strategy must pass ALL of these
# on out-of-sample (walk-forward) data AND on a final untouched holdout.
approval:
  min_oos_trades: 30
  min_oos_expectancy_r: 0.05
  min_oos_profit_factor: 1.15
  min_oos_tstat: 2.0             # mean R must be >= 2 standard errors above zero (guards against luck)
  min_holdout_trades: 8
  min_holdout_expectancy_r: 0.0
  holdout_fraction: 0.2
  walk_forward_folds: 4

# Live (forward paper) review: retire strategies that underperform.
retirement:
  min_live_trades: 30
  retire_if_expectancy_below_r: 0.0

# Trade Decision Bot: minimum estimated edge after shrinkage.
decision:
  min_expected_r: 0.05
  shrinkage_trades: 30           # EV is shrunk toward 0 by n/(n+30)

# Win-rate goal shown on the dashboard. Win rate is tracked but strategies are
# NOT optimised on it alone (that rewards tiny targets + wide stops).
# Goal (v0.11): small losses and positive expectancy, not a high win rate.
goals:
  target_win_rate: 0.70        # kept for reference only
  max_drawdown_pct: 10.0       # the account should never fall more than this below its peak
  min_expectancy_r: 0.10       # average result per trade we aim to beat

# Trade management (v0.12): what happens once a trade moves in our favour.
#   base      = each strategy's own stops, targets and trailing stops
#   breakeven = once a day closes 1R in profit, move the stop to breakeven (entry + costs)
#   partial   = bank half at +1R, then move the rest's stop to breakeven (Peter Brandt style)
# Research tests all three on the same trades every Saturday; the winner is set here.
trade_management:
  mode: breakeven              # v0.13: stop moves to entry (+ costs) once a bar closes +1R in profit
  compare: [base, breakeven, partial]

# Loss Control (v0.11): size every new trade down when big or clustered losses are more likely.
loss_control:
  enabled: true
  vol_high_rank: 0.80          # market's daily range in the top 20% of its past year...
  vol_high_mult: 0.5           # ...risk half
  vol_extreme_rank: 0.95       # top 5%...
  vol_extreme_mult: 0.25       # ...risk a quarter
  dd_soft_pct: 3.0             # account 3% below its peak -> half risk
  dd_soft_mult: 0.5
  dd_hard_pct: 6.0             # 6% below peak -> quarter risk
  dd_hard_mult: 0.25
  streak_losses: 4             # 4 losses in a row -> half risk until a win
  streak_mult: 0.5
  min_mult: 0.25               # never below a quarter of normal risk
  max_positions_per_group: 3   # related markets lose together
  max_open_risk_pct: 3.0       # total risk across open trades

news:
  calendar_file: config/events.yaml
  use_earnings_blackout: true
  earnings_blackout_days: 1
  llm_enabled: false             # needs ANTHROPIC_API_KEY; veto-only, never a buy signal
  llm_model: claude-haiku-5-5

# Learning Lab (v0.7): shadow bots practice-trade EVERY strategy on EVERY market
# (results in R, no position limits, never touches the real paper account).
# The Learning bot promotes/demotes strategies per market group from that evidence.
learning:
  enabled: true
  promote_min_trades: 50          # forward shadow trades needed before promotion
  promote_min_expectancy_r: 0.10
  promote_min_tstat: 2.0
  demote_min_trades: 30
  demote_below_expectancy_r: 0.0

# Confluence bot (v0.8): scores every signal 0-8 on independent factors (trend,
# momentum, key level, Fibonacci zone, volume, volatility, benchmark trend).
# 0 = record only. Raise only once the Learning lab shows high scores really win more.
confluence:
  min_score: 0

notifications:                   # phone push via ntfy; set the NTFY_TOPIC secret to enable
  daily_summary_hour_utc: 22   # v0.13.1: after the US-close decision run

safety:
  max_consecutive_feed_failures: 3
  stale_multiplier: 3.0          # data is stale if last bar older than 3x interval (market-hours aware)
  max_daily_trades: 20

# Time Machine: Monte Carlo odds for every trade before it is taken (v0.9).
time_machine:
  enabled: true
  paths: 10000          # replays per real candidate
  shadow_paths: 2000    # replays per practice (shadow) trade

# Conviction grade (v0.10): confluence first, Time Machine as the final check.
# The Time Machine only votes when 6, 7 or 8 of the 8 confluence factors agree.
#   A+ = confluence 6-8 and the Time Machine confirms   A = 6-8, not confirmed
#   B  = confluence 4-5                                 C = 0-3
conviction:
  high_confluence: 6
  medium_confluence: 4
  confirm_min_exp_r: 0.0     # Time Machine confirms when simulated average R is above this...
  confirm_min_p_target: 0.0  # ...and target-first odds are at least this
  min_grade: null            # e.g. "A+" = only take A+ trades. Record-only until the Learning lab proves it.

# Headlines for open positions and benchmarks, shown on the dashboard (context only).
headlines:
  always: [SPY, QQQ, BTC-USD, EURUSD=X, GLD]
  per_symbol: 3
  max_symbols: 12
